name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels that PR's older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: express

    # Throwaway database for this run, same version as docker-compose.yml.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: stockwatch
          POSTGRES_PASSWORD: stockwatch
          POSTGRES_DB: stockwatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockwatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # No Finnhub key or SMTP settings on purpose: tests must not call outside services.
    env:
      DATABASE_URL: postgresql://stockwatch:stockwatch@localhost:5432/stockwatch_test?schema=public
      TEST_DATABASE_URL: postgresql://stockwatch:stockwatch@localhost:5432/stockwatch_test?schema=public
      DEV_USER_ID: demo-user

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # package-lock.json is gitignored, so `npm ci` isn't available.
      - run: npm install
      - run: npm run typecheck
      - run: npm test

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: react/my-app

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install
      - run: npm run lint
      - run: npm run build
